[package]
name = "facet"
version = "0.1.0"
description = "仕様整理ツール詰め合わせ。Rust 側はプラグインの登録のみで、ロジックは TypeScript 側に置く。"
authors = ["pryo"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# クリップボードへの画像書き込み（M18）。@tauri-apps/api/image の
# Image.fromBytes（png/ico のデコード）が要求する feature
tauri = { version = "2.11.3", features = ["image-png"] }
tauri-plugin-log = "2"
# watch feature が無いと plugin:fs|watch コマンド自体が存在しない
# （notify / notify-debouncer-full がその後ろにある）
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-dialog = "2"
# クリップボードへの書き込み（M6 の Markdown 出力）。
# navigator.clipboard は環境依存で「黙って動かない」経路になりうるので、
# 権限を capabilities に明示できるプラグイン側へ寄せる
tauri-plugin-clipboard-manager = "2"
# OS のゴミ箱への移動。Tauri の fs プラグインは完全削除しか持たないため、
# rev 6章「完全削除はしない」を満たすにはこのクレートが要る
trash = "5"
# PTY（擬似端末）。Claude Code は raw mode の TUI なので、
# tauri-plugin-shell の stdout ストリームでは描画も入力も成立しない。
# Windows では ConPTY を使う
portable-pty = "0.9.0"
# PTY の出力を Channel へ載せるため。生バイトを JSON の数値配列で送ると
# 4倍に膨らむので base64 の文字列にする（デコードは xterm 側）
base64 = "0.23.1"
