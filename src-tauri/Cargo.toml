[package]
name = "facet"
version = "0.1.0"
description = "仕様整理ツール詰め合わせ。Rust 側はプラグインの登録のみで、ロジックは TypeScript 側に置く。"
authors = ["pryo"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
# watch feature が無いと plugin:fs|watch コマンド自体が存在しない
# （notify / notify-debouncer-full がその後ろにある）
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-dialog = "2"
# OS のゴミ箱への移動。Tauri の fs プラグインは完全削除しか持たないため、
# rev 6章「完全削除はしない」を満たすにはこのクレートが要る
trash = "5"
